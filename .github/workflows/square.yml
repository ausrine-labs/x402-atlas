name: square
# The Square's pages every quarter hour, so a post or a wallet proof shows within fifteen minutes
# instead of at the next morning's build. Only /square/ is rewritten: the job starts from the newest
# morning build's own Pages artifact, and every other page is that build's, byte for byte.
# Actions are pinned to commits, as in daily.yml.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"     # off the hour, when GitHub's scheduler is least crowded
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read                       # to find and download the morning build's artifact
  pages: write
  id-token: write
concurrency:
  group: square                       # the build is not in daily.yml's "pages" group; only the short deploy below is
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      base: ${{ steps.base.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - id: base
        name: Start from the newest morning build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          busy=$(gh run list -R "$GITHUB_REPOSITORY" -w daily.yml --json status -q '[.[] | select(.status != "completed")] | length')
          if [ "$busy" != "0" ]; then
            echo "the morning build is running; it writes the Square itself"; echo "run=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          run=$(gh run list -R "$GITHUB_REPOSITORY" -w daily.yml -b main -s success -L 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$run" ] || ! gh run download "$run" -R "$GITHUB_REPOSITORY" -n github-pages -D artifact; then
            echo "::warning::the morning build's site could not be downloaded; the Square waits for the next build"
            echo "run=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mkdir _site && tar -xf artifact/artifact.tar -C _site
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Rewrite the Square
        if: steps.base.outputs.run != ''
        run: python3 tools/square_refresh.py --out _site
      - if: steps.base.outputs.run != ''
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.base != ''
    runs-on: ubuntu-latest
    # daily.yml's own group: the check below and the deploy run while no morning build can, so a
    # morning build that starts after the check waits for this deploy instead of racing it.
    # This job holds the group for seconds, and the next one comes a quarter hour later.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: still
        name: Still the newest morning build?
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.build.outputs.base }}
        run: |
          set -eu
          # A morning build that started or finished while this ran would be rolled back by this
          # deploy: then this run publishes nothing, and the next quarter hour starts from the new one.
          busy=$(gh run list -R "$GITHUB_REPOSITORY" -w daily.yml --json status -q '[.[] | select(.status != "completed")] | length')
          run=$(gh run list -R "$GITHUB_REPOSITORY" -w daily.yml -b main -s success -L 1 --json databaseId -q '.[0].databaseId')
          if [ "$busy" = "0" ] && [ "$run" = "$BASE" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "a newer morning build is running or published; skipping this deploy"; echo "ok=" >> "$GITHUB_OUTPUT"; fi
      - id: deployment
        if: steps.still.outputs.ok == '1'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
