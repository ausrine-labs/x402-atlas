name: solana-windows
# Solana's x402 payments, read in six-hour windows while the free fast RPC still holds them
# (publicnode keeps about 19 hours), then joined into UTC days. tools/solana_flows.py, copied
# from the lab, does the reading; this job only schedules it and keeps its files on the data
# branch, beside the Base files the daily build writes:
#   flows/sol-windows/sol-YYYY-MM-DDTHH.json   one per window, written once
#   flows/flows-sol-YYYY-MM-DD.json            the day, once all four of its windows are in
# Every fifteen minutes, because GitHub starts scheduled jobs hours late and drops many (on
# 2026-10-09 one hourly run of twelve came): each run reads whatever window is due and
# missing. A window past the fast endpoint's ~19 h is filled in later from mainnet-beta, which
# keeps everything but is slow: one such window a run (--backfill-days 3), up to ~90 minutes.
# The Base pages do not read these files yet: until Solana has its own labelled view, the
# Base figures stay Base alone.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write           # only to push the data branch
concurrency:
  group: solana-windows
  cancel-in-progress: false
jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 175       # the steps below stop themselves first; this only catches a hang
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: main
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: "Name for git (a rebase after a lost push race needs one)"
        run: |
          git config --global user.name "Ausrine Jurgutis"
          git config --global user.email "ausrine@infoharmoni.com"
      - name: Newest registry snapshot
        run: |
          set -eu
          SNAP=$(ls data/radar/market-*.json.gz | sort | tail -1)
          gunzip -c "$SNAP" > "$RUNNER_TEMP/market.json"
      - name: "Read the due windows (fast, the free fast service still has them)"
        id: due
        # a window with a page missing or over 1% unread is not written and makes this step fail;
        # the windows that were written are kept below, and the next run tries again
        continue-on-error: true
        timeout-minutes: 40
        run: |
          set -eu
          python3 main/tools/solana_flows.py --snapshot "$RUNNER_TEMP/market.json" catchup --dir data/flows/sol-windows
      - name: Keep what was read
        if: always()
        working-directory: data
        run: sh ../main/tools/keep_solana.sh
      - name: "Fill in one older missing window (slow, the official service, about 0.7 reads a second)"
        # a step that runs out of time stops only itself: what the due step kept is already saved
        continue-on-error: true
        timeout-minutes: 110
        run: |
          set -eu
          python3 main/tools/solana_flows.py --snapshot "$RUNNER_TEMP/market.json" catchup --dir data/flows/sol-windows \
            --backfill-days 3 --max-backfill 1
      - name: Join the last three days once their four windows are in
        if: always()
        run: |
          set -u
          for Y in $(date -u -d '3 days ago' +%F) $(date -u -d '2 days ago' +%F) $(date -u -d yesterday +%F); do
            OUT="data/flows/flows-sol-$Y.json"
            if [ -f "$OUT" ]; then echo "$OUT is already there"; continue; fi
            python3 main/tools/solana_flows.py assemble --day "$Y" --dir data/flows/sol-windows --out "$OUT" \
              || echo "::notice::$Y is not whole on Solana yet"
          done
      - name: Keep what was filled in and joined
        if: always()
        working-directory: data
        run: sh ../main/tools/keep_solana.sh
