name: solana-windows
# Solana's x402 payments, read in six-hour windows while the free fast RPC still holds them
# (publicnode keeps about 19 hours), then joined into UTC days. tools/solana_flows.py, copied
# from the lab, does the reading; this job only schedules it and keeps its files on the data
# branch, beside the Base files the daily build writes:
#   flows/sol-windows/sol-YYYY-MM-DDTHH.json   one per window, written once
#   flows/flows-sol-YYYY-MM-DD.json            the day, once all four of its windows are in
# Hourly, because GitHub starts scheduled jobs hours late: each run reads whatever window is
# due and missing. A window not read within ten hours of its end cannot be read for free any
# more; its day is then never joined, and nothing pretends otherwise.
# The Base pages do not read these files yet: until Solana has its own labelled view, the
# Base figures stay Base alone.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write           # only to push the data branch
concurrency:
  group: solana-windows
  cancel-in-progress: false
jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: main
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Read every due window not yet on the data branch
        # a window with a page missing or over 1% unread is not written and fails this step;
        # the windows that were written are still kept below, and the next run tries again
        continue-on-error: true
        run: |
          set -eu
          SNAP=$(ls data/radar/market-*.json.gz | sort | tail -1)
          gunzip -c "$SNAP" > "$RUNNER_TEMP/market.json"
          python3 main/tools/solana_flows.py --snapshot "$RUNNER_TEMP/market.json" catchup --dir data/flows/sol-windows
      - name: Join the last two days once their four windows are in
        run: |
          set -u
          for Y in $(date -u -d '2 days ago' +%F) $(date -u -d yesterday +%F); do
            OUT="data/flows/flows-sol-$Y.json"
            if [ -f "$OUT" ]; then echo "$OUT is already there"; continue; fi
            python3 main/tools/solana_flows.py assemble --day "$Y" --dir data/flows/sol-windows --out "$OUT" \
              || echo "::notice::$Y is not whole on Solana yet"
          done
      - name: Keep the new files on the data branch
        working-directory: data
        run: |
          set -eu
          if [ -d flows/sol-windows ]; then git add flows/sol-windows; fi
          for f in flows/flows-sol-*.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git -c user.name="Ausrine Jurgutis" -c user.email="ausrine@infoharmoni.com" \
            commit -qm "solana: $(git diff --cached --name-only | xargs -n1 basename | tr '\n' ' ')(run ${GITHUB_RUN_ID})"
          for i in 1 2 3 4 5; do
            git push -q origin HEAD:data && exit 0
            sleep $((i * 5))
            git pull -q --rebase origin data
          done
          echo "::error::the Solana windows could not be pushed to the data branch"
          exit 1
