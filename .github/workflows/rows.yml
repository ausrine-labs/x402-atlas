name: rows
# Per-payment rows for chosen sellers (tools/rows.py), read with the Coinbase node, for the
# paid file at /x402/rows/<name> on the who seller. This repository's artifacts and logs are
# public and the rows are sold, so the file is encrypted to the lab's key
# (tools/rows-recipient.pem; the private half never leaves the lab's machine) before it
# leaves the runner, and only that is uploaded. Run by hand.
on:
  workflow_dispatch:
    inputs:
      wallets:
        description: "Seller wallets, 0x addresses separated by spaces"
        required: true
      days:
        description: "UTC days, YYYY-MM-DD separated by spaces"
        required: true
      name:
        description: "File name, like rows-top3-2026-10-03-10.csv"
        required: true
      funders:
        description: "Also make the funders file from those rows (name: funders-<same name>)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  rows:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Read the rows and encrypt them
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          WALLETS: ${{ inputs.wallets }}
          DAYS: ${{ inputs.days }}
          NAME: ${{ inputs.name }}
          FUNDERS: ${{ inputs.funders }}
        run: |
          set -eu
          printf '%s\n' "$NAME" | grep -Eq '^[a-z0-9][a-z0-9-]{0,80}\.csv$' || { echo "::error::bad name"; exit 1; }
          set --
          for w in $WALLETS; do
            printf '%s\n' "$w" | grep -Eq '^0x[0-9a-fA-F]{40}$' || { echo "::error::bad wallet"; exit 1; }
            set -- "$@" --wallet "$w"
          done
          for d in $DAYS; do
            printf '%s\n' "$d" | grep -Eq '^20[0-9]{2}-[01][0-9]-[0-3][0-9]$' || { echo "::error::bad day"; exit 1; }
            set -- "$@" --day "$d"
          done
          OUT="$RUNNER_TEMP/rows-out"
          mkdir -p "$OUT"
          python3 tools/rows.py "$@" --out "$OUT/$NAME"
          python3 tools/rows.py --check "$OUT/$NAME"
          openssl smime -encrypt -binary -aes256 -outform DER -in "$OUT/$NAME" -out "$RUNNER_TEMP/$NAME.p7m" tools/rows-recipient.pem
          if [ "$FUNDERS" = "true" ]; then
            FNAME="funders-$NAME"
            python3 tools/funders.py --rows "$OUT/$NAME" --out "$OUT/$FNAME"
            python3 tools/funders.py --check "$OUT/$FNAME"
            openssl smime -encrypt -binary -aes256 -outform DER -in "$OUT/$FNAME" -out "$RUNNER_TEMP/$FNAME.p7m" tools/rows-recipient.pem
            openssl smime -encrypt -binary -aes256 -outform DER -in "$OUT/${FNAME%.csv}-summary.json" -out "$RUNNER_TEMP/${FNAME%.csv}-summary.json.p7m" tools/rows-recipient.pem
          fi
          rm -rf "$OUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rows-encrypted
          path: ${{ runner.temp }}/*.p7m
          retention-days: 3
          if-no-files-found: error
