name: daily
# One photograph of the x402 market a day, and the whole site rebuilt from it.
# Runs on GitHub's machines, so a sleeping laptop no longer means a missing day.
# Actions are pinned to commits: this job deploys a public site, and a moved tag must not be able to.
on:
  schedule:
    - cron: "20 7 * * *"          # 07:20 UTC, every day
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55          # the chain pull against the public RPC is the slow part
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Photograph the market and build the site
        run: sh tools/build_site.sh
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
