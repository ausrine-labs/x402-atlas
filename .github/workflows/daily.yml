name: daily
# One photograph of the x402 market a day, and the whole site rebuilt from it.
# Runs on GitHub's machines, so a sleeping laptop no longer means a missing day.
on:
  schedule:
    - cron: "20 7 * * *"          # 07:20 UTC, every day
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Photograph the market and build the site
        run: sh tools/build_site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
